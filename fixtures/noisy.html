<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Noisy page</title><link rel="stylesheet" href="fixture.css">
<style>
  /* What Tailwind generates for animate-pulse. */
  @keyframes pulse { 50% { opacity: .5; } }
  .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  .rounded-md { border-radius: 6px; } .bg-gray-200 { background: #e5e7eb; }
  .h-4 { height: 16px; } .h-24 { height: 96px; } .w-full { width: 100%; } .w-2\/3 { width: 66%; }
  .flex { display: flex; } .flex-col { flex-direction: column; } .gap-2 { gap: 8px; } .h-full { height: 100%; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { padding: 12px; border: 1px solid #e5e5e5; border-radius: 12px; background: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 1s linear infinite; width: 20px; height: 20px; border: 2px solid #0070f3; border-top-color: transparent; border-radius: 50%; }
  .chip { display: inline-block; margin: 4px; padding: 6px 10px; border-radius: 999px; font: 500 12px system-ui; background: #eee;
    transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), transform 150ms cubic-bezier(0.4, 0, 0.2, 1); }
  .chip.on { background: #0070f3; color: #fff; transform: translateY(-2px); }
</style>
</head>
<body>
  <h1>Noisy page</h1>
  <p>Twelve Tailwind animate-pulse skeletons, a spinner, chips that flip every few hundred ms, and zero-length WAAPI calls.</p>
  <div class="grid-cards" id="cards"></div>
  <div><span class="animate-spin" aria-label="Loading posts" style="display:inline-block"></span></div>
  <nav id="chips" aria-label="Filters"></nav>
  <script>
    const cards = document.getElementById('cards');
    for (let i = 0; i < 4; i++) {
      const a = document.createElement('article');
      a.className = 'h-full flex flex-col gap-2 card';
      a.innerHTML = '<div class="h-24 w-full animate-pulse rounded-md bg-gray-200"></div>' +
        '<div class="h-4 w-full animate-pulse rounded-md bg-gray-200"></div>' +
        '<div class="h-4 w-2/3 animate-pulse rounded-md bg-gray-200"></div>';
      cards.append(a);
    }
    const chips = document.getElementById('chips');
    const names = ['All', 'Design', 'Motion', 'Engineering', 'Writing', 'Talks', 'Open source', 'Notes'];
    for (const n of names) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = n;
      chips.append(b);
    }
    let k = 0;
    setInterval(() => {
      const b = chips.children[k++ % chips.children.length];
      b.classList.toggle('on');
      // Zero-length animations, the way libraries "set" a value.
      b.animate([{ opacity: 1 }, { opacity: 1 }], { duration: 0, fill: 'forwards' });
    }, 180);
  </script>
</body>
</html>
